const PREFIX = "life-tracker:";
function readAll() {
  try {
    const raw = localStorage.getItem(PREFIX + "__store__");
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function writeAll(store) { localStorage.setItem(PREFIX + "__store__", JSON.stringify(store)); }
window.storage = {
  async get(key, shared = false) {
    const store = readAll();
    if (!(key in store)) return null;
    return { key, value: store[key], shared };
  },
  async set(key, value, shared = false) {
    const store = readAll();
    store[key] = value;
    writeAll(store);
    return { key, value, shared };
  },
  async delete(key, shared = false) {
    const store = readAll();
    const existed = key in store;
    delete store[key];
    writeAll(store);
    return existed ? { key, deleted: true, shared } : null;
  },
  async list(prefix = "", shared = false) {
    const store = readAll();
    const keys = Object.keys(store).filter((k) => k.startsWith(prefix));
    return { keys, prefix, shared };
  },
};
// ---- end storage polyfill ----

function computeRoutineTotals(g) {

                </div>

{`function doGet(e) {

}
function doPost(e) {

    .getSheetByName("LifeTrackerData")
    || SpreadsheetApp.getActive().insertSheet("LifeTrackerData");
  sh.getRange(1,1).setValue(e.postData.contents);
  return ContentService.createTextOutput('{"status":"ok"}')
    .setMimeType(ContentService.MimeType.JSON);
}`}
                </pre>
                <div style={{ fontSize: 14, color: INK_DIM, lineHeight: 1.6 }}>
                  4. Deploy &rarr; New deployment &rarr; type: Web app.<br />
                  5. Execute as: <b>Me</b>. Who has access: <b>Anyone</b>.<br />
                  6. Deploy, then copy the Web App URL it gives you.<br />
                  7. Paste that URL above and tap the checkmark.
                </div>
                <div style={{ fontSize: 13, color: INK_FAINT, marginTop: 8 }}>This only happens once, inside Google's own site — there's no login step inside this app. Your data is stored as one JSON block in a "LifeTrackerData" tab, not as separate spreadsheet columns.</div>
              </Card>
            </>
          )}
        </div>
      )}

      {undoAction && <div style={{ position: "fixed", left: "50%", transform: "translateX(-50%)", bottom: 74, zIndex: 20, width: "calc(100% - 32px)", maxWidth: 448, background: INK, color: "#fff", borderRadius: 12, padding: "10px 12px", display: "flex", alignItems: "center", gap: 10, boxShadow: CARD_SHADOW }}><span style={{ flex: 1, fontSize: 14 }}>{undoAction.message}</span><button onClick={() => { undoAction.undo(); setUndoAction(null); }} style={{ background: "transparent", border: "none", color: BRASS_DIM, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}><Undo2 size={14} /> Undo</button></div>}

      <div style={{ display: "flex", borderTop: `1px solid ${LINE}`, background: "rgba(255,255,255,0.92)", backdropFilter: "blur(20px)", position: "sticky", bottom: 0, paddingBottom: "env(safe-area-inset-bottom)" }}>
        {[{ id: "dashboard", label: "Home", icon: HomeIcon }, { id: "daily", label: "Today", icon: CalendarDays }, { id: "categories", label: "Planner", icon: LayoutGrid }, { id: "analysis", label: "Insights", icon: TrendingUp }, { id: "datalink", label: "Data Link", icon: Link2 }].map((p) => {
          const Icon = p.icon; const active = page === p.id;
          return <button key={p.id} onClick={() => setPage(p.id)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "6px 0 8px", background: "transparent", border: "none", cursor: "pointer", color: active ? BRASS : INK_FAINT }}><Icon size={18} strokeWidth={active ? 2.2 : 1.8} /><span style={{ fontSize: 11, fontWeight: active ? 600 : 500, fontFamily: disp }}>{p.label}</span></button>;
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LifeTracker />);
  </script>
</body>
