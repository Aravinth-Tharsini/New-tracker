        navigator.serviceWorker.register("service-worker.js").catch(() => {});

   touch-scrolling on the whole page (content renders, but scrolling stops responding
   entirely). #root already clips horizontal overflow, so body doesn't need this too. */

* {

  animation: pageSmoothEnter .42s cubic-bezier(.22,.8,.25,1) both;

/* Opacity-only: earlier this also animated transform:translateY(), which promotes the
   element to its own compositor layer for the animation's duration. That element is also
   the page's actual scroll content, so a swipe started right after switching tabs (exactly
   when people scroll) could get absorbed by the animation instead of moving the page --
   the first couple of scroll attempts would feel stuck until the animation settled. A pure
   opacity fade keeps the same smooth-entry feel without competing with touch scrolling. */
@keyframes pageSmoothEnter {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* Progress tab stat cards: gentle staggered fade + rise-in on load. */
@keyframes statCardIn {

  12%  { opacity: 1; transform: translateX(-50%) scale(1.05) translateY(0); }
  20%  { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
  82%  { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) scale(0.92) translateY(-4px); }

/* Confetti pieces burst outward from the center then fade as they settle, echoing a
   firework-style celebration sticker rather than a single static emoji. */
@keyframes confettiBurst {
  0%   { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 0; }
  18%  { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1) rotate(var(--rot)); opacity: 0; }

/* Respect users who prefer reduced motion */
@media (prefers-reduced-motion: reduce) {

    scroll-behavior: auto !important;

/* ===== Tactile press feedback on every button ===== */

  transition: transform .12s cubic-bezier(.22,.8,.25,1), opacity .12s ease, box-shadow .15s ease;
}
button:active, [role="button"]:active {
  transform: scale(0.95);

/* ===== Smooth color-scheme transition (dark/light mode) ===== */
/* Scoped to just the elements that actually need it (Card/page backgrounds, borders) rather
   than every single node in the tree — a wildcard transition here forces the browser to track
   background/border/color changes on every element in large lists, which is a major source of

// those weekdays starting from eventDate onward.
function myDayEventOccursOn(ev, dateStr) {
  if (!ev || !dateStr) return false;
  if (ev.repeatDays && ev.repeatDays.length > 0) {
    if (ev.eventDate && dateStr < ev.eventDate) return false;
    const wd = weekdayLabel(new Date(dateStr));
    return ev.repeatDays.includes(wd);
  }
  if (!ev.eventDate) return false;
  // Same lead-window rule as travel plans: a My Day entry starts showing on the Daily tab

  const lead = maxReminderLeadDays(ev.reminderOffsets && ev.reminderOffsets.length ? ev.reminderOffsets : []);
  const remindFrom = addDays(ev.eventDate, -lead);

  const max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const range = (max - min) || 1;
  const stepX = points.length > 1 ? (width - pad * 2) / (points.length - 1) : 0;
  const toXY = (p, i) => [pad + i * stepX, pad + (1 - ((Number(p.value) || 0) - min) / range) * (height - pad * 2)];
  const pathD = points.map((p, i) => { const [x, y] = toXY(p, i); return `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`; }).join(" ");
  const lastXY = points.length ? toXY(points[points.length - 1], points.length - 1) : [pad, height - pad];
  const areaD = points.length ? `${pathD} L${lastXY[0].toFixed(1)},${height - pad} L${pad},${height - pad} Z` : "";
  return (
    <div>
      <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height, display: "block" }} preserveAspectRatio="none">
        {points.length > 0 && <path d={areaD} fill={hexA(color, 0.14)} stroke="none" />}

function TrendBarChart({ points, height = 96, color = BRASS, negativeColor }) {

  const max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const range = (max - min) || 1;
  const zeroY = pad + (1 - (0 - min) / range) * (height - pad * 2);
  const barW = points.length ? Math.max(10, (width - pad * 2 - gap * (points.length - 1)) / points.length) : 0;
  const active = activeIdx != null ? points[activeIdx] : null;
  return (
    <div>

        <div style={{ textAlign: "center", marginBottom: 4, fontSize: 12.5, fontWeight: 700, color: (Number(active.value) || 0) < 0 ? (negativeColor || CORAL) : color, fontFamily: mono }}>

        {points.map((p, i) => {

          const barColor = v < 0 ? (negativeColor || CORAL) : color;

              <rect x={x} y={barTop} width={barW} height={h} rx={4} fill={barColor} opacity={activeIdx == null || activeIdx === i ? 1 : 0.45} style={{ pointerEvents: "none" }} />
            </g>
          );
        })}
      </svg>
      <div style={{ display: "flex", marginTop: 4 }}>

// 12-hour time picker (hour / minute / AM-PM) so manually set times match the 12-hour live clock format.
function Time12Input({ value, onChange, style }) {
  const parsed = parseHHMMSafe(value);
  const { h12, period } = to12hParts(parsed.h);

  // Keep raw typed text locally so digits aren't clamped/reformatted mid-keystroke
  // (e.g. typing "6" was being forced back before a second digit could follow).
  const [hourDraft, setHourDraft] = useState(null);
  const [minDraft, setMinDraft] = useState(null);

  const hourDisplay = hourDraft != null ? hourDraft : String(h12);
  const minDisplay = minDraft != null ? minDraft : pad2(parsed.m);

  const commitHour = (raw) => {
    const digits = raw.replace(/[^0-9]/g, "");
    if (digits === "") return;
    const nh12 = Math.min(12, Math.max(1, Number(digits)));
    const h = from12hParts(nh12, period);
    onChange(buildHHMM(h, parsed.m));
  };

  const commitMinute = (raw) => {
    const digits = raw.replace(/[^0-9]/g, "");
    if (digits === "") return;
    const nm = Math.min(59, Math.max(0, Number(digits)));
    onChange(buildHHMM(parsed.h, nm));
  };

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 4, ...style }}>
      <TextField
        type="text" inputMode="numeric" pattern="[0-9]*" maxLength={2}
        value={hourDisplay}
        onChange={(e) => { const digits = e.target.value.replace(/[^0-9]/g, "").slice(0, 2); setHourDraft(digits); commitHour(digits); }}
        onFocus={(e) => e.target.select()}

      />
      <span style={{ color: INK_FAINT, fontWeight: 700 }}>:</span>

        value={minDisplay}
        onChange={(e) => { const digits = e.target.value.replace(/[^0-9]/g, "").slice(0, 2); setMinDraft(digits); commitMinute(digits); }}
        onFocus={(e) => e.target.select()}

          const lateByMin = actualMins - scheduledMins;
          if (lateByMin <= GRACE_MIN) return 1;
          const overBy = lateByMin - GRACE_MIN;
          return Math.max(0, 1 - overBy / DECAY_WINDOW_MIN);
        };
        // Exact percentage (to 1 decimal place when not a whole number) computed from the sum of per-activity
        // timing credits / totalActivities, where totalActivities is only activities actually scheduled for today
        // (interval-type excluded, as they're ongoing rather than "completed"). progressPercent (rounded) is used
        // only for the bar's visual width.
        const totalCredit = validItems.filter((i) => i.type !== "interval").reduce((sum, i) => sum + activityCredit(i), 0);
        const progressPercentExact = totalActivities > 0 ? (totalCredit / totalActivities) * 100 : 0;
        const progressPercent = Math.round(progressPercentExact);
        const progressPercentLabel = totalActivities === 0 ? "0" : Number.isInteger(progressPercentExact) ? String(progressPercentExact) : progressPercentExact.toFixed(1);
        const currentHour = new Date().getHours();
        const greeting = currentHour < 12 ? "Good morning" : currentHour < 18 ? "Good afternoon" : "Good evening";
        const remainingActivities = Math.max(0, totalActivities - completedActivities);
        const nowHHMM = buildHHMM(new Date().getHours(), new Date().getMinutes());
        const incompleteScheduled = validItems
          .filter((i) => i.type !== "interval" && field(i.id).status !== "done" && i.scheduledTime)
          .sort((a, b) => String(a.scheduledTime).localeCompare(String(b.scheduledTime)));
        const upcomingToday = incompleteScheduled.filter((i) => String(i.scheduledTime) >= nowHHMM);
        const overdueToday = incompleteScheduled.filter((i) => String(i.scheduledTime) < nowHHMM).reverse();
        const nextActivities = [...upcomingToday, ...overdueToday].slice(0, 4);
        // The single most urgent pending (non-interval) activity, used so tapping the "activities still pending"
        // reminder can jump straight to it instead of leaving the user to find it themselves: overdue first,
        // then the next upcoming one, then any unscheduled pending activity as a fallback.
        const pendingActivityTarget = overdueToday[0] || upcomingToday[0]
          || validItems.find((i) => i.type !== "interval" && field(i.id).status !== "done" && !i.scheduledTime)
          || null;
        const statCards = [
          { key: "completed", label: "Completed", sub: "activities", value: `${completedActivities}/${totalActivities}`, icon: CheckCircle2, fg: TEAL, bg: "rgba(52,199,89,0.14)" },
          { key: "expenses", label: "Expenses", sub: "today", value: inr(todayExpenses), icon: Wallet, fg: "#8B5CF6", bg: "rgba(139,92,246,0.14)" },

        ];
        return <div key="dashboard-page" className="page-smooth-enter" style={{ padding: "6px 16px 16px", flex: 1, width: "100%" }}>

              <svg width="112" height="98" viewBox="0 0 112 98" style={{ position: "absolute", right: -6, bottom: -10, opacity: darkMode ? 0.6 : 0.9 }}>
                <circle cx="82" cy="60" r="26" fill="#FFFFFF" opacity={darkMode ? 0.12 : 0.55} />

                <circle cx="82" cy="60" r="14" fill="#FFF8EF" opacity={darkMode ? 0.85 : 1} />
                <path d="M0 82 Q30 58 60 78 T112 70 V98 H0 Z" fill="#B9C8E8" opacity={darkMode ? 0.18 : 0.75} />
                <ellipse cx="24" cy="24" rx="13" ry="7" fill="#FFFFFF" opacity={darkMode ? 0.18 : 0.8} />
                <ellipse cx="46" cy="16" rx="9" ry="5" fill="#FFFFFF" opacity={darkMode ? 0.14 : 0.7} />
                <path d="M12 40 q4 -4 8 0 q4 -4 8 0" stroke="#8FA3C9" strokeWidth="1.6" fill="none" strokeLinecap="round" opacity={darkMode ? 0.4 : 1} />
                <path d="M30 32 q3.5 -3.5 7 0" stroke="#8FA3C9" strokeWidth="1.6" fill="none" strokeLinecap="round" opacity={darkMode ? 0.4 : 1} />
              </svg>
              <div style={{ position: "relative", maxWidth: "72%" }}>
                <div style={{ fontSize: 25, fontWeight: 800, color: INK, letterSpacing: "-0.02em" }}>{greeting}! <span style={{ display: "inline-block" }}>👋</span></div>
                <div style={{ fontSize: 14, color: INK_DIM, marginTop: 5, lineHeight: 1.4 }}>
                  {totalActivities === 0

                    : completedActivities === totalActivities
                      ? "Great work! Everything planned for today is completed."
                      : "You've got this. Let's make today count."}
                </div>
              </div>
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 7, marginBottom: 12 }}>
            {statCards.map((s) => {
              const SIcon = s.icon;
              return (
                <Card key={s.key} style={{ padding: "12px 8px", display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", gap: 6 }}>
                  <div style={{ width: 34, height: 34, borderRadius: 10, background: s.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <SIcon size={17} color={s.fg} />
                  </div>
                  <div style={{ fontSize: 12, color: INK_DIM, fontWeight: 600 }}>{s.label}</div>
                  <div style={{ fontSize: 18, fontFamily: mono, fontWeight: 800, color: s.fg }}>{s.value}</div>
                  <div style={{ fontSize: 11, color: INK_FAINT }}>{s.sub}</div>
                </Card>
              );
            })}
          </div>

          {totalActivities > 0 && (
            <Card style={{ marginBottom: 14, padding: "14px 16px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 9 }}>
                    <div style={{ fontSize: 15, fontWeight: 700, color: INK }}>Today's Progress</div>
                    <div style={{ fontSize: 14, color: BRASS, fontFamily: mono, fontWeight: 800 }}>{progressPercentLabel}%</div>
                  </div>
                  <div style={{ height: 8, borderRadius: 999, background: PANEL_2, overflow: "hidden" }}>
                    <div style={{ width: `${progressPercent}%`, height: "100%", borderRadius: 999, background: BRASS, transition: "width 0.25s ease" }} />
                  </div>
                  <div style={{ marginTop: 8, fontSize: 12, color: INK_DIM }}>{completedActivities} of {totalActivities} activities completed</div>
                </div>
                <div style={{ flexShrink: 0, width: 52, height: 52, borderRadius: "50%", background: "radial-gradient(circle at 35% 30%, #DCEBFB, #AFCCF2)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <Rocket size={22} color={BRASS} />

          {nextActivities.length > 0 && (

          {(() => {

            const quickActionItems = [

            return (

                        <span style={{ fontSize: 11.5, fontWeight: 650, color: INK, textAlign: "center", lineHeight: 1.2 }}>{qa.label}</span>
                      </button>

                  })}
                </div>
              </>

          })()}

          {(() => {

            const goalCat = goalAchievementByCat.find((g) => g.id === "career" && g.total > 0 && g.done < g.total)
              || goalAchievementByCat.find((g) => g.total > 0 && g.done < g.total);
            const attentionItems = [
              ...todaysMyDayEvents.slice(0, 1).map((e) => ({

                badge: <span style={{ fontSize: 12.5, fontWeight: 750, color: TODAY_CARD_ACCENT.myday, background: hexA(TODAY_CARD_ACCENT.myday, 0.14), borderRadius: 999, minWidth: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 7px" }}>{todaysMyDayEvents.length}</span>,
                onClick: () => { setExpandedDailyCategory("myday"); setDailyHighlightId(e.id); setPage("daily"); },
              })),
              ...todaysShoppingLists.slice(0, 1).map((s) => ({
                key: "shop-" + s.id, icon: ShoppingBag, accent: TODAY_CARD_ACCENT.shopping, title: "Shopping",
                subtitle: s.shopName ? `${s.shopName} \u00b7 reminder today` : "Reminder today",
                badge: <span style={{ fontSize: 12.5, fontWeight: 750, color: TODAY_CARD_ACCENT.shopping, background: hexA(TODAY_CARD_ACCENT.shopping, 0.14), borderRadius: 999, minWidth: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 7px" }}>{todaysShoppingLists.length}</span>,
                onClick: () => { setExpandedDailyCategory("shopping"); setExpandedDailyShoppingId(s.id); setDailyHighlightId(s.id); setPage("daily"); },
              })),
              ...todaysRepaymentReminders.slice(0, 1).map((r) => ({
                key: "repay-" + r.id, icon: CreditCard, accent: TODAY_CARD_ACCENT.expense, title: "Finance",
                subtitle: `${r.name || r.category}${r.dueDate ? ` \u00b7 ${formatDMY(r.dueDate)}` : ""}`,
                badge: <span style={{ fontSize: 12.5, fontWeight: 750, color: CORAL, background: hexA(CORAL_HEX, 0.14), borderRadius: 999, minWidth: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 7px" }}>{dueRepayments}</span>,
                onClick: () => { setExpandedDailyCategory("expense"); setDailyHighlightId(r.id); setPage("daily"); },
              })),
              ...todaysTravelPlans.slice(0, 1).map((t) => ({
                key: "trip-" + t.id, icon: Plane, accent: TODAY_CARD_ACCENT.trip, title: "Travel",
                subtitle: `${t.fromLocation} \u2192 ${t.toLocation}${t.travelDate ? ` \u00b7 ${formatDMY(t.travelDate)}` : ""}`,
                badge: <span style={{ fontSize: 12.5, fontWeight: 750, color: TODAY_CARD_ACCENT.trip, background: hexA(TODAY_CARD_ACCENT.trip, 0.14), borderRadius: 999, minWidth: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 7px" }}>{todaysTravelPlans.length}</span>,
                onClick: () => { setExpandedDailyCategory("trip"); setDailyHighlightId(t.id); setPage("daily"); },
              })),
              ...(goalCat ? [{
                key: "goal-" + goalCat.id, icon: Target, accent: TODAY_CARD_ACCENT[goalCat.id] || TEAL_HEX, title: `${goalCat.label} Goal`,
                subtitle: `${goalCat.label} \u00b7 ${Math.round((goalCat.done / goalCat.total) * 100)}% completed`,
                badge: <RingProgress pct={(goalCat.done / goalCat.total) * 100} color={TEAL_HEX} size={32} />,
                onClick: () => { setPage("categories"); setCatTab(goalCat.id); },
              }] : []),
              ...(pendingActivities > 0 && pendingActivityTarget ? [{
                key: "pending-activity", icon: Clock, accent: "#F2A65A", title: "Pending activity",
                subtitle: `${pendingActivities} activit${pendingActivities > 1 ? "ies" : "y"} still to do`,
                badge: <span style={{ fontSize: 12.5, fontWeight: 750, color: "#F2A65A", background: "rgba(242,166,90,0.16)", borderRadius: 999, minWidth: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 7px" }}>{pendingActivities}</span>,
                onClick: () => { setExpandedDailyCategory(pendingActivityTarget.category); setActiveTab(pendingActivityTarget.id); setPage("daily"); },
              }] : []),
            ];
            return (
              <>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
                  <SectionLabel style={{ marginBottom: 0 }}>Upcoming Attention</SectionLabel>
                  {attentionItems.length > 0 && <button onClick={() => setPage("daily")} style={{ background: "transparent", border: "none", padding: 0, fontSize: 13, fontWeight: 700, color: BRASS, cursor: "pointer" }}>View all</button>}
                </div>
                {attentionItems.length === 0 ? (
                  <Card><div style={{ color: TEAL, fontSize: 14 }}>✓ Everything looks clear for now.</div></Card>
                ) : (
                  <Card style={{ padding: "2px 14px" }}>
                    {attentionItems.map((it, idx) => (
                      <AttentionRow key={it.key} icon={it.icon} accent={it.accent} title={it.title} subtitle={it.subtitle} badge={it.badge} onClick={it.onClick} isLast={idx === attentionItems.length - 1} />
                    ))}
                  </Card>
                )}
              </>
            );
          })()}
        </div>;
      })()}

      {page === "daily" && (() => {
        const currentHour = new Date().getHours();
        const greeting = currentHour < 12 ? "Good morning" : currentHour < 18 ? "Good afternoon" : "Good evening";
        // One pass over the categories to derive every count/label the header and cards need,
        // so the hero summary and each card read from the same numbers instead of drifting.
        const categoryStats = availableDailyCategories.map((cat) => {
          const expanded = expandedDailyCategory === cat.id;
          const itemsForCat = validItems.filter((i) => i.category === cat.id).slice().sort((a, b) => scheduledMinutes(a) - scheduledMinutes(b));
          // Only remaining (not-yet-done) routines are shown in today's list; completed instant/duration
          // items drop off once marked done, and interval items drop off once their repeat count for
          // the day has been logged in full.
          const pendingItemsForCat = itemsForCat.filter((i) => i.type === "interval" ? !isIntervalComplete(i, todayLog) : field(i.id).status !== "done");
          const todaysExpenseCount = todayLog.expenses.length;
          const todaysExpenseTotal = todayLog.expenses.reduce((s, e) => s + e.amount, 0);
          const visibleTrips = todaysTravelPlans;
          const visibleMyDay = todaysMyDayEvents;
          const shoppingDueCount = todaysShoppingLists.length;
          const expenseDueCount = todaysRepaymentReminders.length;
          const totalCount = cat.id === "trip" ? visibleTrips.length : cat.id === "myday" ? visibleMyDay.length : cat.id === "shopping" ? todaysShoppingLists.length : cat.id === "expense" ? todaysExpenseCount : itemsForCat.length;
          const doneCount = cat.id === "trip" || cat.id === "expense" || cat.id === "myday" || cat.id === "shopping" ? 0 : itemsForCat.filter((i) => i.type !== "interval" && field(i.id).status === "done").length;
          const countLabel = cat.id === "trip" ? `${totalCount} upcoming${todaysTravelPlans.length ? ` \u00b7 ${todaysTravelPlans.length} due` : ""}` : cat.id === "myday" ? `${totalCount} planned${todaysMyDayEvents.length ? ` \u00b7 ${todaysMyDayEvents.length} today` : ""}` : cat.id === "shopping" ? `${totalCount} planned${shoppingDueCount ? ` \u00b7 ${shoppingDueCount} reminder today` : ""}` : cat.id === "expense" ? `${todaysExpenseCount} logged \u00b7 ${inr(todaysExpenseTotal)}${expenseDueCount ? ` \u00b7 ${expenseDueCount} due` : ""}` : `${doneCount}/${totalCount} done`;
          const trackableCount = cat.id === "trip" || cat.id === "expense" || cat.id === "myday" || cat.id === "shopping" ? 0 : itemsForCat.filter((i) => i.type !== "interval").length;
          const attentionCount = cat.id === "trip" ? todaysTravelPlans.length : cat.id === "myday" ? todaysMyDayEvents.length : cat.id === "shopping" ? shoppingDueCount : cat.id === "expense" ? expenseDueCount : Math.max(0, trackableCount - doneCount);
          const accent = TODAY_CARD_ACCENT[cat.id] || BRASS_HEX;
          return { cat, expanded, CatIcon: cat.icon, itemsForCat, pendingItemsForCat, todaysExpenseCount, todaysExpenseTotal, visibleTrips, visibleMyDay, shoppingDueCount, expenseDueCount, totalCount, doneCount, countLabel, trackableCount, attentionCount, accent };
        });
        // Purely a display aggregate for the hero progress ring below \u2014 sums the same
        // per-category done/trackable numbers already computed above, nothing new is tracked.
        const heroTrackable = categoryStats.reduce((s, cs) => s + (cs.trackableCount || 0), 0);
        const heroDone = categoryStats.reduce((s, cs) => s + (cs.doneCount || 0), 0);
        const heroPct = heroTrackable > 0 ? Math.min(1, heroDone / heroTrackable) : 0;
        const heroRingR = 26;
        const heroRingCirc = 2 * Math.PI * heroRingR;
        return (
        <div key="daily-page" className="daily-page-content" style={{ padding: "6px 0 14px", flex: 1, minHeight: 0, width: "100%" }}>

                <div className="today-hero-greeting">{greeting} <span aria-hidden="true">👋</span></div>
                <div className="today-hero-sub">Plan better, stay consistent, achieve your goals.</div>
              </div>
              {heroTrackable > 0 && (
                <div className="today-hero-ring">
                  <svg viewBox="0 0 64 64" width="58" height="58">
                    <circle cx="32" cy="32" r={heroRingR} fill="none" stroke={hexA(BRASS_HEX, darkMode ? 0.28 : 0.14)} strokeWidth="6" />
                    <circle
                      cx="32" cy="32" r={heroRingR} fill="none" stroke={BRASS} strokeWidth="6" strokeLinecap="round"
                      strokeDasharray={heroRingCirc} strokeDashoffset={heroRingCirc * (1 - heroPct)}
                      transform="rotate(-90 32 32)" style={{ transition: "stroke-dashoffset .5s ease" }}
                    />
                  </svg>
                  <div className="today-hero-ring-label">
                    <div className="today-hero-ring-num">{heroDone}<span>/{heroTrackable}</span></div>
                    <div className="today-hero-ring-caption">done</div>
                  </div>

          {availableDailyCategories.length === 0 ? (
            <div className="today-empty-state">
              <div className="today-empty-icon">
                <CalendarDays size={28} color={BRASS} strokeWidth={2.2} />
              </div>
              <div style={{ fontSize: 16, fontWeight: 700, color: INK, marginBottom: 5, fontFamily: disp }}>Nothing to track yet</div>
              <div style={{ fontSize: 13, color: INK_DIM, lineHeight: 1.5 }}>Go to <span style={{ color: BRASS, fontWeight: 600 }}>Planner</span> to add a My Day plan or Trip, or set up Daily Routine, Career growth, or Healthcare goals.</div>
            </div>
          ) : (
            <div className="today-category-grid" style={{ padding: "0 16px" }}>

              {categoryStats.map((cs) => {
                const { cat, expanded, CatIcon, itemsForCat, pendingItemsForCat, todaysExpenseCount, todaysExpenseTotal, visibleTrips, visibleMyDay, shoppingDueCount, expenseDueCount, totalCount, doneCount, countLabel, trackableCount, attentionCount, accent } = cs;
                const badge = attentionCount > 0 && (
                  <div style={{ position: "absolute", top: -7, right: -7, minWidth: 22, height: 22, borderRadius: 999, background: CORAL, color: "#FFFFFF", fontSize: 12, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 5px", border: "2px solid " + BG, fontFamily: mono }}>
                    {attentionCount > 9 ? "9+" : attentionCount}
                  </div>
                );
                // Each category type gets the stat layout that fits its data best: a two-number
                // split (My Day / Trips), a logged-count + total (Expense), a reminder callout
                // (Shopping), or a done/total progress bar (Career growth / Health / Routine).
                const statMode = cat.id === "expense" ? "expense" : cat.id === "shopping" ? "reminder" : (cat.id === "myday" || cat.id === "trip") ? "counts" : "progress";
                return (
                  <div key={cat.id} className={`cat-grid-item ${expanded ? "is-open-row" : (expandedDailyCategory ? "is-collapsed" : "")}`}>
                    {!expanded ? (
                      <button
                        className="today-cardv2"
                        onClick={() => setExpandedDailyCategory(cat.id)}
                        style={{ background: hexA(accent, darkMode ? 0.16 : 0.08) }}
                      >
                        <div className="today-cardv2-icon-wrap" style={{ background: hexA(accent, darkMode ? 0.26 : 0.16) }}>
                          <CatIcon size={24} color={accent} strokeWidth={2.2} />
                          {badge}

                <div style={{ paddingRight: 10 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, color: INK }}>Auto-download backup daily</div>
                  <div style={{ fontSize: 13, color: INK_FAINT, marginTop: 2 }}>Works on any device, including phones. Downloads one backup file to your Downloads folder the first time you make a change each day.</div>
                </div>
                <button onClick={() => setAutoExportEnabled((v) => !v)} style={{ flexShrink: 0, width: 44, height: 26, borderRadius: 999, border: "none", cursor: "pointer", background: autoExportEnabled ? BRASS : LINE, position: "relative", padding: 0 }}>
                  <span style={{ position: "absolute", top: 2, left: autoExportEnabled ? 20 : 2, width: 22, height: 22, borderRadius: "50%", background: "#fff", boxShadow: "0 1px 2px rgba(0,0,0,0.2)", transition: "left 0.15s" }} />
                </button>
              </div>
              {autoExportEnabled && <div style={{ fontSize: 13, color: TEAL, marginTop: 6 }}>{lastAutoExportAt === today ? `Already backed up today (${lastAutoExportAt}).` : "On \u2014 will download on your next change today."}</div>}
            </Card>
          )}

          {dataMode === "online" && (
            <>
              <Card style={{ marginBottom: 9 }}>
                <SectionLabel>Google Sheet sync</SectionLabel>
                <div style={{ fontSize: 14, color: INK_FAINT, marginBottom: 8 }}>Paste your Google Apps Script Web App URL below (see setup guide). Your data auto-saves to it a couple seconds after any change, and auto-loads from it once when you switch on Online mode.</div>
                <div style={{ display: "flex", gap: 5, marginBottom: 8 }}>
                  <TextField value={sheetUrlDraft || sheetUrl} onChange={(e) => setSheetUrlDraft(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" style={{ flex: 1, fontSize: 14 }} />
                  <IconBtn onClick={() => { setSheetUrl(sheetUrlDraft.trim()); didInitialPull.current = false; pullSettledRef.current = false; }}><Check size={15} /></IconBtn>
                </div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                  <ActionButton onClick={pushToSheet} label="Sync now" icon={RefreshCw} tone={BRASS} spinning={syncStatus === "syncing"} />
                  <button onClick={pullFromSheet} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: `1.5px solid ${LINE}`, color: INK_DIM, borderRadius: 8, padding: "6px 12px", fontSize: 15, cursor: "pointer", fontFamily: disp, fontWeight: 600 }}>
                    <Cloud size={15} /> Load from sheet
                  </button>
                </div>
                <div style={{ fontSize: 14, display: "flex", alignItems: "center", gap: 5, color: syncStatus === "error" ? CORAL : syncStatus === "syncing" ? BRASS : TEAL }}>
                  {syncStatus === "error" ? <CloudOff size={14} /> : <Cloud size={14} />}
                  {syncStatus === "syncing" && "Syncing\u2026"}
                  {syncStatus === "success" && lastSyncedAt && `Last synced ${fmtTime(lastSyncedAt)}`}
                  {syncStatus === "error" && "Sync failed \u2014 check the URL and your connection, or tap Sync now to retry."}
                  {syncStatus === "idle" && !lastSyncedAt && "Not synced yet."}
                </div>
              </Card>

              <Card>
                <SectionLabel>One-time setup (in your Google account, not this app)</SectionLabel>
                <div style={{ fontSize: 14, color: INK_DIM, lineHeight: 1.6 }}>
                  1. Open your Google Sheet.<br />
                  2. Extensions &rarr; Apps Script.<br />
                  3. Delete the placeholder code and paste this:
                </div>
                <pre style={{ background: PANEL_2, border: `1px solid ${LINE}`, borderRadius: 7, padding: 10, fontSize: 11, overflowX: "auto", color: INK_DIM, marginTop: 6, marginBottom: 6 }}>
{`function doGet(e) {
  var sh = SpreadsheetApp.getActive()
    .getSheetByName("LifeTrackerData")
    || SpreadsheetApp.getActive().insertSheet("LifeTrackerData");
  var data = sh.getRange(1,1).getValue();
  return ContentService.createTextOutput(data || "{}")
    .setMimeType(ContentService.MimeType.JSON);
}
function doPost(e) {
  var sh = SpreadsheetApp.getActive()
    .getSheetByName("LifeTrackerData")
    || SpreadsheetApp.getActive().insertSheet("LifeTrackerData");
  sh.getRange(1,1).setValue(e.postData.contents);
  return ContentService.createTextOutput('{"status":"ok"}')
    .setMimeType(ContentService.MimeType.JSON);
}`}
                </pre>
                <div style={{ fontSize: 14, color: INK_DIM, lineHeight: 1.6 }}>
                  4. Deploy &rarr; New deployment &rarr; type: Web app.<br />
                  5. Execute as: <b>Me</b>. Who has access: <b>Anyone</b>.<br />
                  6. Deploy, then copy the Web App URL it gives you.<br />
                  7. Paste that URL above and tap the checkmark.
                </div>
                <div style={{ fontSize: 13, color: INK_FAINT, marginTop: 8 }}>This only happens once, inside Google's own site — there's no login step inside this app. Your data is stored as one JSON block in a "LifeTrackerData" tab, not as separate spreadsheet columns.</div>
              </Card>
            </>
          )}
        </div>
      )}

      {celebration && (
        <div key={celebration.key} style={{ position: "fixed", top: "14%", left: "50%", transform: "translateX(-50%)", zIndex: 10002, pointerEvents: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 8, background: "#FFFFFF", border: `1px solid ${LINE}`, borderRadius: 16, padding: "18px 24px", boxShadow: CARD_SHADOW, animation: "celebrationPop 1.4s cubic-bezier(.22,.8,.25,1) both", overflow: "visible" }}>
          <div style={{ position: "relative", width: 64, height: 64 }}>
            {CONFETTI_PIECES.map((p, i) => (
              <span key={i} style={{
                position: "absolute", top: "50%", left: "50%", width: p.size, height: p.size,
                background: p.color, borderRadius: p.shape === "circle" ? "50%" : p.shape === "rect" ? 2 : 0,
                clipPath: p.shape === "star" ? CONFETTI_STAR_CLIP : undefined,
                "--tx": `${p.tx}px`, "--ty": `${p.ty}px`, "--rot": `${p.rot}deg`,
                animation: `confettiBurst 1.1s cubic-bezier(.22,.8,.25,1) ${p.delay}ms both`,
              }} />
            ))}
            <div style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)", fontSize: 32, lineHeight: 1 }}>🎉</div>
          </div>
          <div style={{ fontSize: 14, fontWeight: 700, color: INK, fontFamily: disp, whiteSpace: "nowrap" }}>{celebration.message}</div>
        </div>
      )}

      {undoAction && <div className="toast-slide-enter" style={{ position: "fixed", left: "50%", bottom: 74, zIndex: 20, width: "calc(100% - 32px)", maxWidth: 448, background: INK, color: "#fff", borderRadius: 12, padding: "10px 12px", display: "flex", alignItems: "center", gap: 10, boxShadow: CARD_SHADOW }}><span style={{ flex: 1, fontSize: 14 }}>{undoAction.message}</span><button onClick={() => { undoAction.undo(); setUndoAction(null); }} style={{ background: "transparent", border: "none", color: BRASS_DIM, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}><Undo2 size={14} /> Undo</button></div>}

      {pendingImportData && (
        <div className="modal-backdrop-enter" style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.35)", zIndex: 10001, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div className="modal-pop-enter" style={{ background: PANEL, borderRadius: 14, padding: 18, width: "100%", maxWidth: 360, boxShadow: CARD_SHADOW }}>
            <div style={{ fontSize: 17, fontWeight: 700, color: INK, marginBottom: 6 }}>Replace current data?</div>
            <div style={{ fontSize: 14, color: INK_DIM, lineHeight: 1.5, marginBottom: 16 }}>Importing this backup will replace all data currently in the app on this device. This can't be undone.</div>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button onClick={cancelImport} style={{ background: "transparent", border: `1.5px solid ${LINE}`, color: INK_DIM, borderRadius: 8, padding: "8px 14px", fontSize: 15, cursor: "pointer", fontFamily: disp, fontWeight: 600 }}>Cancel</button>
              <button onClick={confirmImport} style={{ background: CORAL, border: "none", color: "#FFFFFF", borderRadius: 8, padding: "8px 14px", fontSize: 15, cursor: "pointer", fontFamily: disp, fontWeight: 600 }}>Replace data</button>
            </div>
          </div>
        </div>
      )}

      <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 10000, background: "var(--nav-safe-bg)", paddingBottom: "env(safe-area-inset-bottom)", transform: "translateZ(0)" }}>
        <div style={{ display: "flex", borderTop: `1px solid ${LINE}`, background: "var(--nav-bg)" }}>
          {[{ id: "dashboard", label: "Home", icon: HomeIcon }, { id: "daily", label: "Today", icon: CalendarDays }, { id: "categories", label: "Planner", icon: LayoutGrid }, { id: "analysis", label: "Progress", icon: TrendingUp }, { id: "datalink", label: "More", icon: Settings2 }].map((p) => {
            const Icon = p.icon; const active = page === p.id;
            return <button key={p.id} onClick={() => setPage(p.id)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "6px 0 8px", background: "transparent", border: "none", cursor: "pointer", color: active ? BRASS : INK_FAINT }}><Icon size={18} strokeWidth={active ? 2.2 : 1.8} /><span style={{ fontSize: 11, fontWeight: active ? 600 : 500, fontFamily: disp }}>{p.label}</span></button>;
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LifeTracker />);
  </script>
</body>
</html>
