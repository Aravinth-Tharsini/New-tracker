<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Life Tracker</title>

  <!-- Home screen icon + full-screen app behavior -->
  <!-- Cache-busting ?v=2 query on every icon/manifest reference below: Android/Chrome cache
       an installed PWA's icon (and its generated splash) very aggressively by URL, so simply
       replacing the file's contents at the same filename is not enough to make it refetch. -->
  <link rel="manifest" href="manifest.json?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" />
  <meta name="theme-color" content="#F5F5F7" />
  <meta name="color-scheme" content="light dark" />
  <!-- Paint the real page + system bars dark/light BEFORE the app loads, so the status bar and
       the strip behind the gesture-nav bar never flash/stay gray or white. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("life-tracker:__store__");
        var store = raw ? JSON.parse(raw) : {};
        var dark = store.darkMode != null ? JSON.parse(store.darkMode) === true
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var bg = dark ? "#000000" : "#F5F5F7";
        var d = document.documentElement;
        d.style.background = bg;
        d.style.colorScheme = dark ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", bg);
        var c = document.querySelector('meta[name="color-scheme"]');
        if (c) c.setAttribute("content", dark ? "dark" : "light");
        document.addEventListener("DOMContentLoaded", function () { document.body.style.background = bg; });
      } catch (e) {}
    })();
  </script>

  <!-- iOS: run as a standalone app with no browser chrome when added to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Life Tracker" />

  <!-- Android/Chrome: same, for "Add to Home screen" -->
  <meta name="mobile-web-app-capable" content="yes" />

  <script>
    // Registering a service worker is required for Chrome/Android to consider
    // this app installable and show the "Install app" / "Add to Home Screen" prompt.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).then((reg) => {
          // Tell the app (More screen only) when a newer version of the web app has been downloaded.
          const ready = () => { window.__appUpdateReady = true; window.dispatchEvent(new Event("app-update-ready")); };
          if (reg.waiting && navigator.serviceWorker.controller) ready();
          reg.addEventListener("updatefound", () => {
            const nw = reg.installing;
            if (nw) nw.addEventListener("statechange", () => { if (nw.state === "installed" && navigator.serviceWorker.controller) ready(); });
          });
          const check = () => { try { reg.update().catch(() => {}); } catch (e) {} };
          check(); setInterval(check, 60 * 60 * 1000);
        }).catch(() => {});
      });
    }
  </script>

  

<style id="mobile-auto-fit-ui">
/* ===== SIMPLE MOBILE AUTO-FIT UI ===== */
*{box-sizing:border-box;}
html,#root{width:100%;max-width:100%;min-height:100%;margin:0;overflow-x:hidden;}
html{min-height:100vh;min-height:100dvh;background-color:inherit;}
/* IMPORTANT: overflow-x:hidden must NOT also be set on <body> at the same time as <html>.
   Stacking it on both is a known iOS/WebKit trigger that can silently disable vertical
   touch-scrolling on the whole page (content renders, but scrolling stops responding
   entirely). #root already clips horizontal overflow, so body doesn't need this too. */
body{width:100%;max-width:100%;min-height:100%;margin:0;}
body{min-height:100dvh;padding-bottom:calc(88px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;
  -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;}
#root{width:100%;min-width:0;}
button,input,select,textarea{font-size:16px;max-width:100%;min-width:0;}
img,svg{max-width:100%;}
/* Prevent long cards/rows from pushing outside the phone screen */
#root *{min-width:0;}
#root [style*="display: flex"],#root [style*="display:flex"]{max-width:100%;}
/* Better touch targets */
button{touch-action:manipulation;}
@media(max-width:480px){
  #root{width:100vw;}
}
@media(max-width:380px){
  #root{font-size:14px;}
}
@media(min-width:768px){
  #root{max-width:700px;margin:0 auto;}
}
/* Bottom navigation: compact and easy to understand on every phone */
@media(max-width:420px){
  #root button{max-width:100%;}
}

/* ===== Smooth mobile interaction & page changes ===== */
* {
  -webkit-tap-highlight-color: transparent !important;
}

html {
  scroll-behavior: smooth;
}

button, [role="button"], a {
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}

button:focus-visible, [role="button"]:focus-visible, a:focus-visible {
  outline: 2px solid rgba(180, 140, 60, .45);
  outline-offset: 2px;
}

.page-smooth-enter {
  animation: pageSmoothEnter .42s cubic-bezier(.22,.8,.25,1) both;
}

/* Opacity-only: earlier this also animated transform:translateY(), which promotes the
   element to its own compositor layer for the animation's duration. That element is also
   the page's actual scroll content, so a swipe started right after switching tabs (exactly
   when people scroll) could get absorbed by the animation instead of moving the page --
   the first couple of scroll attempts would feel stuck until the animation settled. A pure
   opacity fade keeps the same smooth-entry feel without competing with touch scrolling. */
@keyframes pageSmoothEnter {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* Progress tab stat cards: gentle staggered fade + rise-in on load. */
@keyframes statCardIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Home "Good Morning" card: hand wave + gentle entrance for the motivation chip. */
@keyframes goodMorningWave {
  0%, 100% { transform: rotate(0deg); }
  15% { transform: rotate(16deg); }
  30% { transform: rotate(-8deg); }
  45% { transform: rotate(14deg); }
  60% { transform: rotate(-4deg); }
  75% { transform: rotate(6deg); }
}
.good-morning-wave {
  animation: goodMorningWave 2.4s ease-in-out .3s 1;
  transform-origin: 70% 70%;
}
@keyframes goodMorningRiseIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}
.good-morning-motivation {
  animation: goodMorningRiseIn .5s cubic-bezier(.22,.8,.25,1) .15s both;
}

/* ===== Welcome ribbon atmosphere: realistic sky/moon lighting, kept subtle ===== */
@keyframes ribbonStarTwinkle {
  0%, 100% { opacity: 0.25; }
  50% { opacity: 0.9; }
}
@keyframes ribbonBreezeDrift {
  0% { transform: translateX(-30%); opacity: 0; }
  15% { opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translateX(130%); opacity: 0; }
}
@keyframes ribbonCloudDrift {
  0% { transform: translateX(0); }
  100% { transform: translateX(-16px); }
}
@keyframes ribbonBirdFly {
  0% { transform: translate(0, 0); opacity: 0; }
  8% { opacity: 1; }
  50% { transform: translate(220%, -6px); }
  92% { opacity: 1; }
  100% { transform: translate(440%, 0); opacity: 0; }
}

/* ===== Celebration pop-up: pops in, holds briefly, fades out on its own ===== */
@keyframes celebrationPop {
  0%   { opacity: 0; transform: translateX(-50%) scale(0.75) translateY(-6px); }
  12%  { opacity: 1; transform: translateX(-50%) scale(1.05) translateY(0); }
  20%  { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
  82%  { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) scale(0.92) translateY(-4px); }
}
/* Confetti pieces burst outward from the center then fade as they settle, echoing a
   firework-style celebration sticker rather than a single static emoji. */
@keyframes confettiBurst {
  0%   { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 0; }
  18%  { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1) rotate(var(--rot)); opacity: 0; }
}

/* Respect users who prefer reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ===== Tactile press feedback on every button ===== */
button, [role="button"] {
  transition: transform .12s cubic-bezier(.22,.8,.25,1), opacity .12s ease, box-shadow .15s ease;
}
button:active, [role="button"]:active {
  transform: scale(0.95);
  opacity: 0.85;
}

/* ===== Smooth color-scheme transition (dark/light mode) ===== */
/* Scoped to just the elements that actually need it (Card/page backgrounds, borders) rather
   than every single node in the tree — a wildcard transition here forces the browser to track
   background/border/color changes on every element in large lists, which is a major source of
   scroll jank once a page has more than a couple dozen rows. */
#root {
  transition: background-color .28s ease;
}
.theme-fade {
  transition: background-color .28s ease, border-color .28s ease, color .28s ease;
}

/* ===== Card / list-row press feedback for tappable rows ===== */
.tap-row {
  transition: transform .12s cubic-bezier(.22,.8,.25,1), opacity .12s ease;
}
.tap-row:active {
  transform: scale(0.98);
  opacity: 0.9;
}

/* ===== Modal / dialog entrance ===== */
.modal-backdrop-enter {
  animation: modalBackdropFade .2s ease both;
}
.modal-pop-enter {
  animation: modalPopIn .26s cubic-bezier(.22,1.1,.36,1) both;
}
@keyframes modalBackdropFade {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes modalPopIn {
  from { opacity: 0; transform: scale(.92) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

/* ===== Toast / undo bar entrance ===== */
.toast-slide-enter {
  animation: toastSlideUp .3s cubic-bezier(.22,.9,.3,1.2) both;
}
@keyframes toastSlideUp {
  from { opacity: 0; transform: translate(-50%, 16px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}

/* ===== Spin animation for sync-in-progress icon ===== */
.spin-icon {
  animation: spinIcon .9s linear infinite;
  transform-origin: 50% 50%;
}
@keyframes spinIcon {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* ===== Gentle pop for checkmarks / completion states ===== */
.pop-in {
  animation: popIn .22s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(.6); }
  to   { opacity: 1; transform: scale(1); }
}
.confetti-pop {
  animation: confettiPopIn .3s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes confettiPopIn {
  from { opacity: 0; transform: scale(.3) rotate(var(--rot, 0deg)); }
  to   { opacity: 1; transform: scale(1) rotate(var(--rot, 0deg)); }
}

/* ===== Smooth height/opacity for expanding sections ===== */
.expand-enter {
  animation: expandFadeIn .22s ease both;
}
@keyframes expandFadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}


/* Consistent mobile arrays, history rows and smooth touch feedback */
.history-list-row,.mobile-array-row{width:100%;min-width:0;box-sizing:border-box;display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);overflow:hidden;transition:transform .16s cubic-bezier(.22,.8,.25,1),opacity .16s ease,background-color .2s ease;
  /* Skip layout/paint work for rows scrolled off-screen so long history/expense lists stay smooth. */
  content-visibility:auto;contain-intrinsic-size:auto 52px;}
.history-list-row:active,.mobile-array-row:active{transform:scale(.985);opacity:.88}
.history-list-row .history-main,.mobile-array-row .mobile-array-main{flex:1 1 auto;min-width:0;overflow:hidden}
.history-list-row .history-title,.mobile-array-row .mobile-array-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-list-row .history-actions,.mobile-array-row .mobile-array-actions{flex:0 0 auto;display:flex;align-items:center;gap:5px;margin-left:4px}
.history-list-row .history-amount,.mobile-array-row .mobile-array-amount{flex:0 0 auto;white-space:nowrap;max-width:34%;overflow:hidden;text-overflow:ellipsis}
.history-delete-btn{min-width:42px!important;width:42px!important;height:42px!important;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 42px!important}
/* Shared History open/close animation for every section */
.history-panel-enter{animation:historyPanelOpen .28s cubic-bezier(.22,.8,.25,1) both;transform-origin:top center}
@keyframes historyPanelOpen{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.history-toggle-active{box-shadow:0 4px 12px rgba(38,160,106,.16)}
.mobile-array-grid{width:100%;min-width:0}
@media(max-width:420px){.mobile-array-grid{gap:7px!important}.mobile-array-grid .today-focus-card{min-height:60px!important;padding:8px 9px!important;gap:9px!important}.mobile-array-grid .today-focus-icon{width:34px!important;height:34px!important;border-radius:9px!important}.history-list-row,.mobile-array-row{gap:8px;padding:9px 2px}.history-list-row .history-amount,.mobile-array-row .mobile-array-amount{max-width:30%;font-size:13px}.history-list-row .history-actions,.mobile-array-row .mobile-array-actions{gap:3px}}
/* Shared Daily + Planner layout: compact, balanced and consistent */
.daily-page-content,.planner-page-content{animation:contentFadeIn .42s cubic-bezier(.22,.8,.25,1) both}
@keyframes contentFadeIn{from{opacity:0}to{opacity:1}}
.daily-page-content .mobile-array-grid,.planner-page-content .mobile-array-grid{gap:8px!important}
.daily-page-content .today-focus-card,.planner-page-content .today-focus-card{min-height:58px!important;padding:8px 10px!important;gap:9px!important}
.daily-page-content .today-focus-icon,.planner-page-content .today-focus-icon{width:34px!important;height:34px!important;border-radius:9px!important}
.daily-page-content .cat-grid-item,.planner-page-content .cat-grid-item{transition:none!important}
@media(max-width:420px){.daily-page-content .mobile-array-grid,.planner-page-content .mobile-array-grid{gap:7px!important}.daily-page-content .today-focus-card,.planner-page-content .today-focus-card{min-height:56px!important;padding:8px 9px!important}}
</style>

  .progress-shell{width:100%;max-width:100%;padding:6px 16px 20px;overflow:visible}
  .progress-hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;margin-bottom:12px;border:1px solid var(--line);
    background:linear-gradient(135deg,rgba(200,138,18,.14),rgba(200,138,18,.04) 58%,var(--panel) 100%)}
  .progress-hero-title{font-size:22px;font-weight:850;line-height:1.16;letter-spacing:-.02em}

  .progress-stat-value{font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:18px;font-weight:850;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .progress-stat-sub{font-size:10.5px;color:var(--ink-faint);margin-top:1px}

  .progress-insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .progress-mini{padding:11px}

  .progress-mini-sub{font-size:11px;color:var(--ink-faint);margin-top:2px;line-height:1.35}
  .progress-empty{padding:18px 10px;text-align:center;color:var(--ink-faint);font-size:13px;line-height:1.45}
  .progress-list-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
  .progress-list-row:first-child{border-top:none}
  .progress-list-main{min-width:0;flex:1}
  .progress-list-title{font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .progress-list-meta{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
  .progress-pill{font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:11px;font-weight:800;white-space:nowrap}
  .progress-area-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .progress-year-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  @media(max-width:380px){
    .progress-shell{padding-left:12px;padding-right:12px}
    .progress-stat{padding:9px;gap:7px}
    .progress-stat-icon{width:34px;height:34px;flex-basis:34px}
    .progress-stat-value{font-size:16px}
  }
</style>

        *{box-sizing:border-box;} input,select,button{max-width:100%; font-family:${Oe};} .no-scrollbar{scrollbar-width:none; -ms-overflow-style:none;} .no-scrollbar::-webkit-scrollbar{display:none; width:0; height:0;}
        [data-theme="light"]{
          --ink:#1D1D1F; --ink-dim:#6E6E73; --ink-faint:#AEAEB2;
          --panel:#FFFFFF; --panel-2:#F0F3FA; --bg:#F4F6FB; --line:#E7E9F2;
          --brass:#2F6FED; --brass-dim:#BFD3FB; --teal:#22C55E; --coral:#EF4444;
          --card-shadow:0 1px 2px rgba(30,41,89,0.04), 0 10px 26px rgba(30,41,89,0.07);
          --nav-bg:rgba(255,255,255,0.98);
          --nav-safe-bg:#F4F6FB;
        }
        [data-theme="dark"]{
          --ink:#F2F2F7; --ink-dim:#AEAEB6; --ink-faint:#7C7C80;
          --panel:#1C1C1E; --panel-2:#2C2C2E; --bg:#000000; --line:#38383A;
          --brass:#4C86FF; --brass-dim:#1B3468; --teal:#30D158; --coral:#FF453A;
          --card-shadow:0 1px 2px rgba(0,0,0,0.5), 0 1px 8px rgba(0,0,0,0.4);
          --nav-bg:rgba(28,28,30,0.98);
          --nav-safe-bg:#000000;
        }
        /* ===== Responsive top header (title + dark mode / reminders / holidays / calendar icons) ===== */
        .app-header-bar {
          gap: 8px;
          min-width: 0;
        }
        .app-header-title {
          flex-shrink: 1;
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .app-header-icons {
          min-width: 0;
          flex-shrink: 1;
          gap: clamp(4px, 2vw, 10px);
        }
        .app-header-icons > button {
          flex-shrink: 0;
        }
        .header-date-btn {
          min-width: 0;
          flex-shrink: 1;
          padding: clamp(6px, 2vw, 8px) clamp(8px, 2.5vw, 14px) clamp(6px, 2vw, 8px) clamp(6px, 2vw, 12px) !important;
          gap: clamp(4px, 1.5vw, 8px) !important;
        }
        .header-date-btn > span {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          min-width: 0;
        }
        .header-date-short { display: none; }
        .header-date-chevron { flex-shrink: 0; }
        @media (max-width: 400px) {
          .header-date-full { display: none; }
          .header-date-short { display: inline; }
        }
        @media (max-width: 340px) {
          .header-date-chevron { display: none; }
        }
        /* Today category cards: clean, visual-first UI */
        .today-hero {
          display: flex; align-items: center; justify-content: space-between; gap: 14px;
          margin: 2px 16px 18px; padding: 18px 20px; border-radius: 24px;
          background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
          border: 1px solid var(--line); box-shadow: var(--card-shadow);
        }
        .today-hero-greeting { font-size: 19px; font-weight: 800; font-family: -apple-system, ui-rounded, 'SF Pro Display', sans-serif; color: var(--ink); letter-spacing: -0.01em; }
        .today-hero-sub { font-size: 13px; color: var(--ink-dim); margin-top: 3px; line-height: 1.4; }
        .today-hero-ring { position: relative; flex-shrink: 0; display: grid; place-items: center; }
        .today-hero-ring svg { display: block; }
        .today-hero-ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .today-hero-ring-num { font-family: 'JetBrains Mono', ui-rounded, monospace; font-size: 13px; font-weight: 800; color: var(--ink); line-height: 1; }
        .today-hero-ring-num span { font-weight: 600; color: var(--ink-faint); }
        .today-hero-ring-caption { font-size: 9px; color: var(--ink-faint); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
        .today-empty-state { margin: 0 16px; padding: 40px 20px; text-align: center; background: linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%); border-radius: 24px; box-shadow: var(--card-shadow); border: 1px solid var(--line); }
        .today-empty-icon { width: 58px; height: 58px; border-radius: 18px; background: rgba(10,132,255,0.14); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .today-expanded-header { display: flex; align-items: center; gap: 12px; padding: 2px 16px 16px; }
        .today-expanded-header-text { min-width: 0; flex: 1; }
        .today-expanded-header-title { font-size: 19px; font-weight: 800; font-family: -apple-system, ui-rounded, 'SF Pro Display', sans-serif; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; }
        .today-expanded-header-sub { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; font-weight: 600; }
        .today-expanded-header .today-focus-card.is-open { margin-right: 0 !important; flex-shrink: 0; }
        .today-expand-enter { animation: todaySlideIn .48s cubic-bezier(.22,.8,.25,1) both; overflow: hidden; }
        @keyframes todaySlideIn {
          from { opacity: 0; transform: translateY(-8px); max-height: 0; }
          to { opacity: 1; transform: translateY(0); max-height: 3000px; }
        }
        /* Planner tab content (Finance/Shopping/Trip/etc.) has no bounded height \u2014 user-added
           items (e.g. a Shopping list with several items) can easily grow past the 3000px cap
           that .today-expand-enter holds onto forever via animation-fill-mode:both. That combo
           of overflow:hidden + a frozen max-height silently clipped tall content and blocked
           scrolling past that point. This variant keeps the same fade/slide-in feel with no
           height cap and no overflow clipping. */
        .planner-tab-enter { animation: plannerTabEnter .38s cubic-bezier(.22,.8,.25,1) both; }
        @keyframes plannerTabEnter {
          from { opacity: 0; transform: translateY(-8px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .today-focus-card {
          position: relative;
          min-height: 150px !important;
          flex-direction: column !important;
          align-items: center !important;
          justify-content: center !important;
          text-align: center !important;
          gap: 9px !important;
          padding: 16px 12px 14px !important;
          border-radius: 26px !important;
          border: 1px solid rgba(0,0,0,.04) !important;
          box-shadow: 0 1px 2px rgba(20,30,45,.04), 0 6px 18px rgba(20,30,45,.06) !important;
          overflow: visible !important;
          transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease !important;
        }
        .today-focus-card:active { transform: scale(.965); box-shadow: 0 1px 2px rgba(20,30,45,.04), 0 2px 8px rgba(20,30,45,.05) !important; }
        .today-focus-card.is-open {
          min-height: 58px !important;
          height: 58px !important;
          width: 58px !important;
          padding: 6px !important;
          gap: 0 !important;
          border-radius: 17px !important;
          justify-content: center !important;
          align-items: center !important;
          align-self: flex-start !important;
          margin-right: auto !important;
          overflow: hidden !important;
        }
        .today-focus-icon {
          width: 68px !important;
          height: 68px !important;
          border-radius: 20px !important;
          background: var(--icon-tint, rgba(255,255,255,.62)) !important;
          border: 1px solid var(--icon-tint-border, rgba(255,255,255,.82));
          box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 3px 10px rgba(20,30,45,.07);
          transition: width .42s cubic-bezier(.22,.8,.25,1), height .42s cubic-bezier(.22,.8,.25,1),
                      border-radius .42s cubic-bezier(.22,.8,.25,1), transform .42s cubic-bezier(.22,.8,.25,1);
        }
        .today-focus-card.is-open .today-focus-icon {
          width: 44px !important;
          height: 44px !important;
          border-radius: 13px !important;
          transform: scale(.96);
        }
        .today-focus-text {
          width: 100%;
          transition: opacity .28s ease, transform .38s cubic-bezier(.22,.8,.25,1), width .38s ease;
        }
        .today-focus-card.is-open .today-focus-text,
        .today-focus-card.is-open .today-focus-arrow,

          width: 40px;

        .today-cardv2 {
