name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json service-worker.js www/
          cp *.png icon.svg www/ 2>/dev/null || true
          cp node_modules/@babel/standalone/babel.min.js www/babel.min.js
          curl -sSL https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o www/jspdf.umd.min.js
          sed -i 's#https://unpkg.com/@babel/standalone@7/babel.min.js#babel.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#jspdf.umd.min.js#' www/index.html

      - name: Add Android project
        run: npx cap add android

      - name: Raise the version number on every build
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Use my app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          im() { if command -v magick >/dev/null 2>&1; then magick "$@"; else convert "$@"; fi; }
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; px=${pair##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              im icon-512.png -resize ${px}x${px} $RES/mipmap-$d/$n.png
            done
          done

      - name: Use my permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
          else
            cp debug.keystore ~/.android/debug.keystore
          fi

      - name: Show signing fingerprint (must be identical on every build)
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA256" || echo "Could not read the fingerprint"

      - name: Allow notifications and exact alarms
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Allow storage access for backups
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application android:requestLegacyExternalStorage="true"#' $MANIFEST

      - name: Add ringing alarm plugin (native Android code)
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR=android/app/src/main/java/$(echo "$APPID" | tr . /)
          mkdir -p "$DIR"

          cat > "$DIR/MainActivity.java" <<'EOF'
          package __APPID__;

          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AlarmRingPlugin.class);
              super.onCreate(savedInstanceState);
              getWindow().setStatusBarColor(android.graphics.Color.BLACK);
              getWindow().setNavigationBarColor(android.graphics.Color.BLACK);
              showOverLockIfAlarm(getIntent());
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              showOverLockIfAlarm(intent);
            }

            // When the app is opened by a ringing alarm, show it over the lock screen and light up the screen.
            private void showOverLockIfAlarm(Intent intent) {
              try {
                if (intent != null && intent.getBooleanExtra("fromAlarm", false)) {
                  if (Build.VERSION.SDK_INT >= 27) {
                    setShowWhenLocked(true);
                    setTurnScreenOn(true);
                  } else {
                    getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | android.view.WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                  }
                  getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                }
              } catch (Exception e) {}
            }
          }
          EOF

          cat > "$DIR/AlarmRingPlugin.java" <<'EOF'
          package __APPID__;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "AlarmRing")
          public class AlarmRingPlugin extends Plugin {

            static PendingIntent op(Context c, int id, JSONObject o) {
              Intent i = new Intent(c, AlarmReceiver.class);
              i.setAction("alarm.ring." + id);
              int flags = PendingIntent.FLAG_IMMUTABLE;
              if (o != null) {
                i.putExtra("title", o.optString("title", "Alarm"));
                i.putExtra("body", o.optString("body", ""));
                i.putExtra("kind", o.optString("kind", ""));
                i.putExtra("itemId", o.optString("itemId", ""));
                i.putExtra("key", o.optString("key", ""));
                flags |= PendingIntent.FLAG_UPDATE_CURRENT;
              } else {
                flags |= PendingIntent.FLAG_NO_CREATE;
              }
              return PendingIntent.getBroadcast(c, id, i, flags);
            }

            // Sets every not-yet-passed alarm of one group as an exact "alarm clock" alarm (fires in Doze, over the lock screen).
            static void setGroup(Context c, String group, JSONArray arr, boolean saveIds) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              SharedPreferences sp = c.getSharedPreferences("alarm_ring", Context.MODE_PRIVATE);
              if (saveIds) {
                String old = sp.getString("ids_" + group, "");
                if (!old.isEmpty()) {
                  for (String s : old.split(",")) {
                    try {
                      PendingIntent pi = op(c, Integer.parseInt(s), null);
                      if (pi != null) { am.cancel(pi); pi.cancel(); }
                    } catch (Exception e) {}
                  }
                }
              }
              StringBuilder ids = new StringBuilder();
              Intent launch = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
              PendingIntent showPi = PendingIntent.getActivity(c, 0, launch, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              long now = System.currentTimeMillis();
              for (int k = 0; k < arr.length(); k++) {
                try {
                  JSONObject o = arr.getJSONObject(k);
                  int id = o.getInt("id");
                  long at = o.getLong("at");
                  if (at <= now + 500) continue; // never fire a passed alarm immediately
                  am.setAlarmClock(new AlarmManager.AlarmClockInfo(at, showPi), op(c, id, o));
                  if (ids.length() > 0) ids.append(",");
                  ids.append(id);
                } catch (Exception e) {}
              }
              if (saveIds) {
                sp.edit().putString("ids_" + group, ids.toString()).putString("items_" + group, arr.toString()).apply();
              }
            }

            // After a phone restart or an app update Android forgets alarms, so every saved group is set again.
            static void rescheduleAll(Context c) {
              try {
                SharedPreferences sp = c.getSharedPreferences("alarm_ring", Context.MODE_PRIVATE);
                for (String key : sp.getAll().keySet()) {
                  if (key.startsWith("items_")) {
                    try { setGroup(c, key.substring(6), new JSONArray(sp.getString(key, "[]")), false); } catch (Exception e) {}
                  }
                }
              } catch (Exception e) {}
            }

            @PluginMethod
            public void schedule(PluginCall call) {
              String group = call.getString("group", "main");
              JSArray items = call.getArray("items");
              JSONArray arr = new JSONArray();
              if (items != null) {
                for (int k = 0; k < items.length(); k++) {
                  try { arr.put(items.getJSONObject(k)); } catch (Exception e) {}
                }
              }
              setGroup(getContext(), group, arr, true);
              call.resolve();
            }

            @PluginMethod
            public void getRinging(PluginCall call) {
              JSObject out = new JSObject();
              out.put("ringing", AlarmService.ringing);
              out.put("title", AlarmService.curTitle == null ? "" : AlarmService.curTitle);
              out.put("body", AlarmService.curBody == null ? "" : AlarmService.curBody);
              out.put("kind", AlarmService.curKind == null ? "" : AlarmService.curKind);
              out.put("itemId", AlarmService.curItemId == null ? "" : AlarmService.curItemId);
              out.put("key", AlarmService.curKey == null ? "" : AlarmService.curKey);
              call.resolve(out);
            }

            @PluginMethod
            public void stopRing(PluginCall call) {
              try { getContext().stopService(new Intent(getContext(), AlarmService.class)); } catch (Exception e) {}
              call.resolve();
            }

            @PluginMethod
            public void batteryStatus(PluginCall call) {
              JSObject out = new JSObject();
              boolean ok = true;
              try {
                if (Build.VERSION.SDK_INT >= 23) {
                  PowerManager pm = (PowerManager) getContext().getSystemService(Context.POWER_SERVICE);
                  ok = pm.isIgnoringBatteryOptimizations(getContext().getPackageName());
                }
              } catch (Exception e) {}
              out.put("ok", ok);
              call.resolve(out);
            }

            @PluginMethod
            public void openBatterySettings(PluginCall call) {
              Context c = getContext();
              try {
                Intent i = new Intent(android.provider.Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + c.getPackageName()));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                c.startActivity(i);
              } catch (Exception e) {
                try {
                  Intent i2 = new Intent(android.provider.Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);
                  i2.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  c.startActivity(i2);
                } catch (Exception e2) {}
              }
              call.resolve();
            }

            @PluginMethod
            public void saveDownload(PluginCall call) {
              try {
                String name = call.getString("filename", "backup.json");
                String data = call.getString("data", "");
                String mime = call.getString("mime", "application/json");
                Context c = getContext();
                android.content.ContentResolver r = c.getContentResolver();
                JSObject out = new JSObject();
                if (android.os.Build.VERSION.SDK_INT >= 29) {
                  android.content.ContentValues v = new android.content.ContentValues();
                  v.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, name);
                  v.put(android.provider.MediaStore.MediaColumns.MIME_TYPE, mime);
                  v.put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS + "/LifeTracker");
                  android.net.Uri uri = r.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  if (uri == null) { call.reject("insert failed"); return; }
                  java.io.OutputStream os = r.openOutputStream(uri);
                  os.write(data.getBytes("UTF-8"));
                  os.close();
                } else {
                  java.io.File dir = new java.io.File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), "LifeTracker");
                  dir.mkdirs();
                  java.io.FileOutputStream fo = new java.io.FileOutputStream(new java.io.File(dir, name));
                  fo.write(data.getBytes("UTF-8"));
                  fo.close();
                }
                out.put("path", "Downloads/LifeTracker/" + name);
                call.resolve(out);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }

            @PluginMethod
            public void setBars(final PluginCall call) {
              final String col = call.getString("color", "#000000");
              final boolean dark = call.getBoolean("dark", true);
              getActivity().runOnUiThread(new Runnable() {
                public void run() {
                  try {
                    int c = android.graphics.Color.parseColor(col);
                    android.view.Window w = getActivity().getWindow();
                    w.setStatusBarColor(c);
                    w.setNavigationBarColor(c);
                    androidx.core.view.WindowInsetsControllerCompat ic =
                      androidx.core.view.WindowCompat.getInsetsController(w, w.getDecorView());
                    ic.setAppearanceLightStatusBars(!dark);
                    ic.setAppearanceLightNavigationBars(!dark);
                  } catch (Exception e) {}
                }
              });
              call.resolve();
            }
          }
          EOF

          cat > "$DIR/AlarmReceiver.java" <<'EOF'
          package __APPID__;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import androidx.core.content.ContextCompat;

          public class AlarmReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context context, Intent intent) {
              Intent s = new Intent(context, AlarmService.class);
              s.putExtra("title", intent.getStringExtra("title"));
              s.putExtra("body", intent.getStringExtra("body"));
              s.putExtra("kind", intent.getStringExtra("kind"));
              s.putExtra("itemId", intent.getStringExtra("itemId"));
              s.putExtra("key", intent.getStringExtra("key"));
              ContextCompat.startForegroundService(context, s);
            }
          }
          EOF

          cat > "$DIR/BootReceiver.java" <<'EOF'
          package __APPID__;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context context, Intent intent) {
              AlarmRingPlugin.rescheduleAll(context);
            }
          }
          EOF

          cat > "$DIR/AlarmService.java" <<'EOF'
          package __APPID__;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import androidx.core.app.NotificationCompat;

          public class AlarmService extends Service {
            public static volatile boolean ringing = false;
            public static volatile String curTitle, curBody, curKind, curItemId, curKey;
            private MediaPlayer mp;
            private Vibrator vib;
            private final Handler handler = new Handler(Looper.getMainLooper());

            @Override
            public IBinder onBind(Intent intent) { return null; }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
              if (intent != null && "STOP".equals(intent.getAction())) {
                stopSelf();
                return START_NOT_STICKY;
              }
              String title = intent != null ? intent.getStringExtra("title") : null;
              String body = intent != null ? intent.getStringExtra("body") : null;
              if (title == null) title = "Alarm";
              if (body == null) body = "";
              curTitle = title; curBody = body;
              curKind = intent != null ? intent.getStringExtra("kind") : null;
              curItemId = intent != null ? intent.getStringExtra("itemId") : null;
              curKey = intent != null ? intent.getStringExtra("key") : null;
              ringing = true;

              NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel ch = new NotificationChannel("alarm_ring", "Alarms", NotificationManager.IMPORTANCE_HIGH);
                ch.setSound(null, null);
                ch.enableVibration(false);
                ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                nm.createNotificationChannel(ch);
              }
              Intent launch = getPackageManager().getLaunchIntentForPackage(getPackageName());
              launch.putExtra("fromAlarm", true);
              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
              PendingIntent open = PendingIntent.getActivity(this, 1, launch, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              Intent stop = new Intent(this, AlarmService.class);
              stop.setAction("STOP");
              PendingIntent stopPi = PendingIntent.getService(this, 2, stop, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

              Notification n = new NotificationCompat.Builder(this, "alarm_ring")
                .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                .setContentTitle(title)
                .setContentText(body)
                .setCategory(NotificationCompat.CATEGORY_ALARM)
                .setPriority(NotificationCompat.PRIORITY_MAX)
                .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                .setOngoing(true)
                .setFullScreenIntent(open, true)
                .setContentIntent(open)
                .addAction(0, "Stop", stopPi)
                .build();

              if (Build.VERSION.SDK_INT >= 29) {
                startForeground(7001, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
              } else {
                startForeground(7001, n);
              }

              stopRing();
              try {
                mp = new MediaPlayer();
                mp.setAudioAttributes(new AudioAttributes.Builder()
                  .setUsage(AudioAttributes.USAGE_ALARM)
                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                  .build());
                Uri uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                if (uri == null) uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                mp.setDataSource(this, uri);
                mp.setLooping(true);
                mp.prepare();
                mp.start();
              } catch (Exception e) {}
              try {
                vib = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                if (vib != null) {
                  if (Build.VERSION.SDK_INT >= 26) vib.vibrate(VibrationEffect.createWaveform(new long[]{0, 800, 600}, 0));
                  else vib.vibrate(new long[]{0, 800, 600}, 0);
                }
              } catch (Exception e) {}

              handler.removeCallbacksAndMessages(null);
              handler.postDelayed(new Runnable() { public void run() { stopSelf(); } }, 120000);
              return START_NOT_STICKY;
            }

            private void stopRing() {
              try { if (mp != null) { mp.stop(); mp.release(); } } catch (Exception e) {}
              mp = null;
              try { if (vib != null) vib.cancel(); } catch (Exception e) {}
            }

            @Override
            public void onDestroy() {
              ringing = false;
              handler.removeCallbacksAndMessages(null);
              stopRing();
              super.onDestroy();
            }
          }
          EOF

          sed -i "s/__APPID__/$APPID/" "$DIR"/*.java

          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' $MANIFEST
          sed -i 's#</application>#<receiver android:name=".AlarmReceiver" android:exported="false" />\n        <receiver android:name=".BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /><action android:name="android.intent.action.MY_PACKAGE_REPLACED" /></intent-filter></receiver>\n        <service android:name=".AlarmService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>#' $MANIFEST

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: life-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
