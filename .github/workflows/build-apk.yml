name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json service-worker.js www/
          cp *.png icon.svg www/ 2>/dev/null || true
          cp node_modules/@babel/standalone/babel.min.js www/babel.min.js
          curl -sSL https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o www/jspdf.umd.min.js
          sed -i 's#https://unpkg.com/@babel/standalone@7/babel.min.js#babel.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#jspdf.umd.min.js#' www/index.html

      - name: Add Android project
        run: npx cap add android

      - name: Use my app icon
        run: |
          im() { if command -v magick >/dev/null 2>&1; then magick "$@"; else convert "$@"; fi; }
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; px=${pair##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              im icon-512.png -resize ${px}x${px} $RES/mipmap-$d/$n.png
            done
          done

      - name: Use my permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Allow notifications and exact alarms
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: life-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
